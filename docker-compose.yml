# Common Compose services.
# Always combine this file with docker-compose.qa.yml or
# docker-compose.production.example.yml.
services:
  db:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10

  notification-worker:
    build:
      context: ./backend
    init: true
    command: ["python", "scripts/run_notification_scheduler.py"]
    depends_on:
      backend:
        condition: service_healthy
