services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sogang_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sogang_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sogang_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  notification-worker:
    build: ./backend
    command: ["python", "scripts/run_notification_scheduler.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sogang_app
      NOTIFICATION_JOB_HOUR: "9"
      NOTIFICATION_JOB_MINUTE: "0"
      NOTIFICATION_JOB_RUN_ON_START: "false"
    volumes:
      - ./backend:/app

volumes:
  pgdata:
